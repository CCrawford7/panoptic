name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/panoptic${{ matrix.ext }} dist/
          cd dist
          tar czf "panoptic-${{ matrix.target }}.tar.gz" panoptic${{ matrix.ext }}
          sha256sum "panoptic-${{ matrix.target }}.tar.gz" > "panoptic-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist -Force
          Copy-Item "target/${{ matrix.target }}/release/panoptic${{ matrix.ext }}" -Destination dist/
          Compress-Archive -Path "dist/panoptic${{ matrix.ext }}" -DestinationPath "dist/panoptic-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panoptic-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > RELEASE_NOTES.md << EOF
          ## Panoptic v${VERSION}

          **The all-seeing project dashboard for your development folders.**

          ### Installation

          \`\`\`bash
          # Via Cargo
          cargo install panoptic

          # Linux (x86_64)
          tar xzf panoptic-x86_64-unknown-linux-gnu.tar.gz
          sudo mv panoptic /usr/local/bin/

          # macOS (Intel)
          tar xzf panoptic-x86_64-apple-darwin.tar.gz
          sudo mv panoptic /usr/local/bin/

          # macOS (Apple Silicon)
          tar xzf panoptic-aarch64-apple-darwin.tar.gz
          sudo mv panoptic /usr/local/bin/

          # Windows
          # Extract panoptic-x86_64-pc-windows-msvc.zip
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Panoptic v${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
